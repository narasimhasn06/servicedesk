name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore api/ServiceDesk.slnx

      - name: Build
        run: dotnet build api/ServiceDesk.slnx --no-restore -c Release

      - name: Test
        run: dotnet test api/ServiceDesk.slnx --no-build -c Release